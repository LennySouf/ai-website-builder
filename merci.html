
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message envoyé — NOVA STUDIO</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0c0c16;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .merci-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      box-sizing: border-box;
      text-align: center;
      background:
        radial-gradient(
          circle at 50% 40%,
          rgba(145, 93, 255, 0.18),
          transparent 55%
        ),
        #0c0c16;
    }

    .merci-card {
      width: 100%;
      max-width: 650px;
      padding: 65px 35px;
      border: 1px solid rgba(177, 145, 255, 0.25);
      border-radius: 28px;
      background: rgba(22, 20, 38, 0.85);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .merci-icon {
      font-size: 60px;
      color: #b191ff;
      margin-bottom: 25px;
    }

    .merci-logo {
      color: #b191ff;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 30px;
    }

    .merci-card h1 {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.2;
      margin-bottom: 22px;
    }

    .merci-card p {
      color: #c7c0dc;
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .merci-button {
      display: inline-block;
      padding: 17px 30px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #a77bff,
        #7852d9
      );
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.3s;
    }

    .merci-button:hover {
      transform: translateY(-3px);
    }

    @media (max-width: 600px) {
      .merci-card {
        padding: 45px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="merci-page">
    <div class="merci-card">

      <div class="merci-logo">NOVA STUDIO.</div>

      <div class="merci-icon">✓</div>

      <h1>Merci pour votre message !</h1>

      <p>
        Votre demande a bien été envoyée.
        Nous reviendrons vers vous dès que possible
        pour discuter de votre projet.
      </p>

      <a href="index.html" class="merci-button">
        Retour à l'accueil ↗
      </a>

    </div>
  </main>

</body>
</html>
